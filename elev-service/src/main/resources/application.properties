spring.application.name=elev-service
server.port=8081

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=elev-service
spring.kafka.consumer.auto-offset-reset=earliest

elev.kafka.topic=elever

# PostgreSQL (started with docker compose).
# Values come from environment variables; the part after ':' is the local default.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/elevdb}
spring.datasource.username=${DB_USER:elev}
spring.datasource.password=${DB_PASSWORD:elev}

# Tables are created by Flyway (src/main/resources/db/migration).
# Hibernate only validates that @Entity matches the tables.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Actuator: /actuator/health (used by the Docker healthcheck) and /actuator/info.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
