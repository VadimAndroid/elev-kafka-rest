# Infrastructure only (for running the services from IntelliJ / gradlew):
#   docker compose up -d
#
# Everything in Docker, including elev-api and elev-service:
#   docker compose --profile app up -d --build

services:
  kafka:
    image: apache/kafka:4.3.1
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Two listeners for clients:
      #   INTERNAL - for containers in this compose network  -> kafka:29092
      #   EXTERNAL - for programs on your Mac (IntelliJ)      -> localhost:9092
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # Single broker: internal topics can only have one copy.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  postgres:
    image: postgres:17-alpine
    container_name: elev-postgres
    environment:
      POSTGRES_DB: elevdb
      POSTGRES_USER: elev
      POSTGRES_PASSWORD: elev
    ports:
      - "5432:5432"
    volumes:
      - elev-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elev -d elevdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  elev-service:
    profiles: [app]
    build: ./elev-service
    container_name: elev-service
    ports:
      - "8081:8081"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DB_URL: jdbc:postgresql://postgres:5432/elevdb
      DB_USER: elev
      DB_PASSWORD: elev
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

  elev-api:
    profiles: [app]
    build: ./elev-api
    container_name: elev-api
    ports:
      - "8080:8080"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      ELEV_SERVICE_URL: http://elev-service:8081
    depends_on:
      kafka:
        condition: service_healthy
      elev-service:
        condition: service_started

volumes:
  elev-pgdata:
