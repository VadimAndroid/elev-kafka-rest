name: CI

on:
  push:
  pull_request:

# Cancel an older run on the same branch when a new commit is pushed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [elev-api, elev-service]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      # Caches Gradle and downloaded dependencies between runs.
      - uses: gradle/actions/setup-gradle@v6

      # elev-service tests use Testcontainers. Docker is already installed
      # on the ubuntu runner, so PostgreSQL and Kafka start as in local tests.
      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report-${{ matrix.service }}
          path: ${{ matrix.service }}/build/reports/tests/test

  docker:
    name: Docker image ${{ matrix.service }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [elev-api, elev-service]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Only checks that the Dockerfile builds. The image is not pushed anywhere.
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service }}
          push: false
          tags: ${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
