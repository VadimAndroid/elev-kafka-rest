services:
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"

  postgres:
    image: postgres:17-alpine
    container_name: elev-postgres
    environment:
      POSTGRES_DB: elevdb
      POSTGRES_USER: elev
      POSTGRES_PASSWORD: elev
    ports:
      - "5432:5432"
    volumes:
      - elev-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elev -d elevdb"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  elev-pgdata:
