spring.application.name=elev-service
server.port=8081

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=elev-service
spring.kafka.consumer.auto-offset-reset=earliest

elev.kafka.topic=elever

# H2-database med fillagring - data beholdes ved omstart
spring.datasource.url=jdbc:h2:file:./data/elevdb
spring.datasource.username=sa
spring.datasource.password=

# Tabellene lages av Flyway (src/main/resources/db/migration).
# Hibernate skal bare sjekke at @Entity stemmer med tabellene, ikke endre dem.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# H2-konsoll for aa se innholdet i databasen: http://localhost:8081/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console