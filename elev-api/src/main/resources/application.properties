spring.application.name=elev-api

# Values come from environment variables; the part after ':' is the local default.
# In docker compose they point to the containers (kafka:29092, http://elev-service:8081).
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.properties.max.block.ms=5000
elev.kafka.topic=elever

elev.service.url=${ELEV_SERVICE_URL:http://localhost:8081}
